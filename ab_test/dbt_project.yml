name: ab_test
version: "1.0.0"
config-version: 2

# Which connection in ~/.dbt/profiles.yml to use (kept outside the repo).
profile: ab_test

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

# How each layer is built in BigQuery (dataset ab_dbt).
models:
  ab_test:
    staging:
      +materialized: view   # thin rename/cast layer over raw.ab_data; cheap to rebuild
    intermediate:
      +materialized: table  # cleaned one-row-per-user tables, queried by marts and the notebook
    marts:
      +materialized: table  # small summary tables for Looker Studio
